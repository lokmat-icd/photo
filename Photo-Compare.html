<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Photo Gallery</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #e9edf3;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 20px;
}

.gallery {
    width: 100%;
    max-width: 1300px;
    background: white;
    border-radius: 16px;
    padding: 20px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.15);
}

/* Header */
.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 15px;
}

.header h1 {
    color: #1d3557;
    font-size: 24px;
}

.counter {
    background: #1d3557;
    color: white;
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 14px;
}

/* Image area */
.image-container {
    width: 100%;
    height: 65vh;
    min-height: 400px;
    background: #111;
    border-radius: 10px;
    overflow: hidden;
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: default;
    touch-action: none;
}

.image-container:active {
    cursor: grabbing;
}

#photo {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    transform-origin: center center;
    transition: transform 0.15s ease;
    user-select: none;
    -webkit-user-drag: none;
    pointer-events: none;
    display: block;
}

/* Zoom controls */
.zoom-controls {
    position: absolute;
    right: 15px;
    top: 15px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    z-index: 10;
}

.zoom-controls button {
    width: 40px;
    height: 40px;
    border: none;
    border-radius: 50%;
    background: rgba(0,0,0,0.7);
    color: white;
    font-size: 20px;
    cursor: pointer;
}

.zoom-controls button:hover {
    background: rgba(40,90,150,0.9);
}

/* Navigation */
.navigation {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 15px;
    margin: 18px 0;
    flex-wrap: wrap;
}

.nav-btn {
    border: none;
    background: #1d3557;
    color: white;
    padding: 12px 25px;
    border-radius: 25px;
    font-size: 16px;
    cursor: pointer;
}

.nav-btn:hover {
    background: #457b9d;
}

.slideshow {
    background: #2a9d8f;
}

.slideshow.stop {
    background: #e63946;
}

/* Jump controls */
.jump-controls {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    margin-bottom: 18px;
    flex-wrap: wrap;
}

.jump-controls input {
    width: 100px;
    padding: 10px;
    border: 1px solid #bbb;
    border-radius: 6px;
    text-align: center;
    font-size: 15px;
}

.jump-controls button {
    padding: 10px 18px;
    border: none;
    border-radius: 6px;
    background: #457b9d;
    color: white;
    cursor: pointer;
}

/* Photo number buttons */
.photo-buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    max-height: 180px;
    overflow-y: auto;
    padding: 10px;
    border: 1px solid #ddd;
    border-radius: 8px;
    background: #f7f7f7;
}

.photo-buttons button {
    width: 34px;
    height: 30px;
    border: none;
    border-radius: 4px;
    background: #d8e2ed;
    color: #222;
    cursor: pointer;
    font-size: 12px;
}

.photo-buttons button:hover {
    background: #8ecae6;
}

.photo-buttons button.active {
    background: #1d3557;
    color: white;
    font-weight: bold;
}

/* Status */
.status {
    text-align: center;
    margin-top: 12px;
    color: #666;
    font-size: 13px;
}

/* Responsive */
@media(max-width: 600px) {

    .gallery {
        padding: 12px;
    }

    .image-container {
        height: 50vh;
        min-height: 250px;
    }

    .nav-btn {
        padding: 10px 16px;
        font-size: 14px;
    }

    .header h1 {
        font-size: 20px;
    }
}
</style>
</head>

<body>

<div class="gallery">

    <div class="header">
        <h1>Photo Gallery</h1>

        <div class="counter">
            Photo <span id="currentNumber">1</span>
            / <span id="totalNumber">1000</span>
        </div>
    </div>

    <!-- IMAGE DISPLAY -->
    <div class="image-container" id="imageContainer">

        <img id="photo" alt="Photo">

        <div class="zoom-controls">
            <button onclick="zoomIn()">+</button>
            <button onclick="zoomOut()">−</button>
            <button onclick="resetZoom()">⟳</button>
        </div>

    </div>

    <!-- NAVIGATION -->
    <div class="navigation">

        <button class="nav-btn" onclick="previousPhoto()">
            ◀ Previous
        </button>

        <button class="nav-btn slideshow" id="slideshowBtn"
                onclick="toggleSlideshow()">
            ▶ Slideshow
        </button>

        <button class="nav-btn" onclick="nextPhoto()">
            Next ▶
        </button>

    </div>

    <!-- JUMP TO PHOTO -->
    <div class="jump-controls">

        <input
            type="number"
            id="photoInput"
            min="1"
            max="1000"
            placeholder="Photo No."
        >

        <button onclick="goToPhoto()">Go</button>
        <button onclick="goToFirst()">First</button>
        <button onclick="goToLast()">Last</button>

    </div>

    <!-- NUMBER BUTTONS -->
    <div class="photo-buttons" id="photoButtons"></div>

    <div class="status">
        Use ← → arrow keys to navigate |
        Space = Slideshow |
        + / − = Zoom |
        Drag = Pan when zoomed
    </div>

</div>

<script>

/* =====================================================
   SETTINGS
===================================================== */

const TOTAL_PHOTOS = 1000;

const GITHUB_BASE =
    "https://raw.githubusercontent.com/lokmat-icd/photo/main/";

let currentPhoto = 1;

let zoomLevel = 1;

let slideshowTimer = null;


/* =====================================================
   PAN STATE
===================================================== */

let translateX = 0;
let translateY = 0;

let isDragging = false;

let startX = 0;
let startY = 0;

let initialTranslateX = 0;
let initialTranslateY = 0;


/* =====================================================
   DOM ELEMENTS
===================================================== */

const photo = document.getElementById("photo");

const imageContainer =
    document.getElementById("imageContainer");

const currentNumber =
    document.getElementById("currentNumber");

const totalNumber =
    document.getElementById("totalNumber");

const photoButtons =
    document.getElementById("photoButtons");

const photoInput =
    document.getElementById("photoInput");

const slideshowBtn =
    document.getElementById("slideshowBtn");


totalNumber.textContent = TOTAL_PHOTOS;


/* =====================================================
   IMAGE URL
===================================================== */

function getPhotoURL(number) {

    /*
       Encodes:
       Photo (1).jpg

       into:
       Photo%20%281%29.jpg
    */

    const filename = `Photo (${number}).jpg`;

    return GITHUB_BASE + encodeURIComponent(filename);
}


/* =====================================================
   GENERATE PHOTO BUTTONS
===================================================== */

function createPhotoButtons() {

    photoButtons.innerHTML = "";

    for (let i = 1; i <= TOTAL_PHOTOS; i++) {

        const btn = document.createElement("button");

        btn.textContent = i;

        btn.id = "photoBtn" + i;

        btn.onclick = function() {
            showPhoto(i);
        };

        photoButtons.appendChild(btn);
    }
}


/* =====================================================
   APPLY TRANSFORM
===================================================== */

function applyTransform() {

    photo.style.transform =
        `scale(${zoomLevel}) translate(${translateX}px, ${translateY}px)`;
}


/* =====================================================
   SHOW PHOTO
===================================================== */

function showPhoto(number) {

    if (number < 1)
        number = TOTAL_PHOTOS;

    if (number > TOTAL_PHOTOS)
        number = 1;

    currentPhoto = number;

    /* Reset zoom and pan for new image */
    zoomLevel = 1;

    translateX = 0;
    translateY = 0;

    photo.style.transition = "none";

    photo.src = getPhotoURL(number);

    photo.alt = `Photo ${number}`;

    currentNumber.textContent = number;

    photoInput.value = number;

    applyTransform();

    updateActiveButton();

    imageContainer.style.cursor = "default";

    /* Restore transition */
    setTimeout(() => {
        photo.style.transition = "transform 0.15s ease";
    }, 50);
}


/* =====================================================
   ACTIVE BUTTON
===================================================== */

function updateActiveButton() {

    document.querySelectorAll(".photo-buttons button")
        .forEach(btn => btn.classList.remove("active"));

    const activeBtn =
        document.getElementById("photoBtn" + currentPhoto);

    if (activeBtn) {

        activeBtn.classList.add("active");

        activeBtn.scrollIntoView({
            behavior: "smooth",
            block: "nearest"
        });

    }
}


/* =====================================================
   NAVIGATION
===================================================== */

function nextPhoto() {
    showPhoto(currentPhoto + 1);
}

function previousPhoto() {
    showPhoto(currentPhoto - 1);
}

function goToFirst() {
    showPhoto(1);
}

function goToLast() {
    showPhoto(TOTAL_PHOTOS);
}


/* =====================================================
   JUMP TO PHOTO
===================================================== */

function goToPhoto() {

    const number = parseInt(photoInput.value);

    if (!isNaN(number) &&
        number >= 1 &&
        number <= TOTAL_PHOTOS) {

        showPhoto(number);

    } else {

        alert(
            "Please enter a number between 1 and " +
            TOTAL_PHOTOS
        );

    }
}


/* =====================================================
   SLIDESHOW
===================================================== */

function toggleSlideshow() {

    if (slideshowTimer) {

        clearInterval(slideshowTimer);

        slideshowTimer = null;

        slideshowBtn.textContent = "▶ Slideshow";

        slideshowBtn.classList.remove("stop");

    } else {

        slideshowTimer = setInterval(() => {
            nextPhoto();
        }, 5000);

        slideshowBtn.textContent = "■ Stop";

        slideshowBtn.classList.add("stop");

    }
}


/* =====================================================
   ZOOM
===================================================== */

function updateZoom() {

    if (zoomLevel < 0.5)
        zoomLevel = 0.5;

    if (zoomLevel > 3)
        zoomLevel = 3;

    applyTransform();

    if (zoomLevel > 1) {
        imageContainer.style.cursor = "grab";
    } else {
        imageContainer.style.cursor = "default";
    }
}


function zoomIn() {

    zoomLevel += 0.1;

    updateZoom();
}


function zoomOut() {

    zoomLevel -= 0.1;

    updateZoom();
}


function resetZoom() {

    zoomLevel = 1;

    translateX = 0;
    translateY = 0;

    applyTransform();

    imageContainer.style.cursor = "default";
}


/* =====================================================
   MOUSE PAN
===================================================== */

imageContainer.addEventListener("mousedown", function(e) {

    if (zoomLevel <= 1)
        return;

    isDragging = true;

    startX = e.clientX;
    startY = e.clientY;

    initialTranslateX = translateX;
    initialTranslateY = translateY;

    imageContainer.style.cursor = "grabbing";

    photo.style.transition = "none";

});


window.addEventListener("mousemove", function(e) {

    if (!isDragging)
        return;

    const dx = e.clientX - startX;
    const dy = e.clientY - startY;

    translateX = initialTranslateX + dx;
    translateY = initialTranslateY + dy;

    applyTransform();

});


window.addEventListener("mouseup", function() {

    if (!isDragging)
        return;

    isDragging = false;

    imageContainer.style.cursor =
        zoomLevel > 1 ? "grab" : "default";

    photo.style.transition =
        "transform 0.15s ease";

});


/* =====================================================
   TOUCH PAN
===================================================== */

let touchStartX = 0;
let touchStartY = 0;

let touchInitialTranslateX = 0;
let touchInitialTranslateY = 0;


imageContainer.addEventListener("touchstart", function(e) {

    if (zoomLevel <= 1)
        return;

    const touch = e.touches[0];

    touchStartX = touch.clientX;
    touchStartY = touch.clientY;

    touchInitialTranslateX = translateX;
    touchInitialTranslateY = translateY;

    photo.style.transition = "none";

}, { passive: true });


imageContainer.addEventListener("touchmove", function(e) {

    if (zoomLevel <= 1)
        return;

    e.preventDefault();

    const touch = e.touches[0];

    const dx = touch.clientX - touchStartX;
    const dy = touch.clientY - touchStartY;

    translateX = touchInitialTranslateX + dx;
    translateY = touchInitialTranslateY + dy;

    applyTransform();

}, { passive: false });


imageContainer.addEventListener("touchend", function() {

    photo.style.transition =
        "transform 0.15s ease";

});


/* =====================================================
   MOUSE WHEEL ZOOM
===================================================== */

imageContainer.addEventListener("wheel", function(e) {

    e.preventDefault();

    if (e.deltaY < 0) {
        zoomIn();
    } else {
        zoomOut();
    }

}, { passive: false });


/* =====================================================
   KEYBOARD CONTROLS
===================================================== */

document.addEventListener("keydown", function(e) {

    if (e.key === "ArrowRight") {

        nextPhoto();

    } else if (e.key === "ArrowLeft") {

        previousPhoto();

    } else if (e.key === " ") {

        e.preventDefault();

        toggleSlideshow();

    } else if (e.key === "+" || e.key === "=") {

        zoomIn();

    } else if (e.key === "-") {

        zoomOut();

    } else if (e.key === "0") {

        resetZoom();

    }

});


/* =====================================================
   IMAGE ERROR HANDLING
===================================================== */

photo.onerror = function() {

    photo.alt = "Photo not found";

    console.warn(
        "Image not found:",
        photo.src
    );

};


/* =====================================================
   INITIALIZE
===================================================== */

createPhotoButtons();

showPhoto(1);

</script>

</body>
</html>
