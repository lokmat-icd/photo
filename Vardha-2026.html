<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lokmat - Advertisement Dashboard</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.2.0/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <style>
        /* ============================================================
           DARK THEME - IMPROVED LEGIBILITY
           ============================================================ */
        * { box-sizing: border-box; }
        body {
            background: #0d1117;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
            color: #e6edf3;
        }
        .container-fluid { max-width: 1400px; margin: 0 auto; }

        /* SCROLLBAR */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #161b22; border-radius: 3px; }
        ::-webkit-scrollbar-thumb { background: #30363d; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #58a6ff; }

        /* LOGIN OVERLAY */
        #loginOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #loginOverlay .login-box {
            background: #161b22;
            padding: 40px 50px;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.7);
            max-width: 420px;
            width: 100%;
            border: 1px solid #30363d;
        }
        #loginOverlay .login-box .logo {
            text-align: center;
            margin-bottom: 25px;
        }
        #loginOverlay .login-box .logo img {
            width: 50%;
            height: auto;
            max-height: 80px;
            object-fit: cover;
            object-position: center;
            border-radius: 18px;
        }
        #loginOverlay .login-box h3 {
            text-align: center;
            color: #58a6ff;
            margin-bottom: 5px;
            font-weight: 600;
        }
        #loginOverlay .login-box p.sub {
            text-align: center;
            color: #8b949e;
            font-size: 13px;
            margin-bottom: 25px;
        }
        #loginOverlay .login-box .form-group {
            margin-bottom: 18px;
        }
        #loginOverlay .login-box .form-group label {
            font-weight: 600;
            font-size: 13px;
            color: #8b949e;
        }
        #loginOverlay .login-box .form-group input {
            border-radius: 8px;
            border: 1px solid #30363d;
            background: #0d1117;
            color: #e6edf3;
            padding: 10px 14px;
            font-size: 14px;
            width: 100%;
        }
        #loginOverlay .login-box .form-group input:focus {
            outline: none;
            border-color: #58a6ff;
            box-shadow: 0 0 0 2px rgba(88, 166, 255, 0.2);
        }
        #loginOverlay .login-box .form-group input::placeholder {
            color: #484f58;
        }
        #loginOverlay .login-box .login-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #238636;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        #loginOverlay .login-box .login-btn:hover {
            background: #2ea043;
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(35, 134, 54, 0.4);
        }
        #loginOverlay .login-box .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        #loginOverlay .login-box .login-error {
            color: #f85149;
            font-size: 13px;
            text-align: center;
            margin-top: 12px;
            display: none;
        }
        #loginOverlay .login-box .login-error.show { display: block; }

        /* HEADER */
        .header {
            background: #161b22;
            color: #e6edf3;
            padding: 12px 22px;
            border-radius: 12px;
            margin-bottom: 0;
            border: 1px solid #30363d;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .header-row1 {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px 15px;
            min-height: 48px;
        }
        .header-left {
            display: flex;
            align-items: center;
            flex-shrink: 0;
        }
        .header-logo {
            width: 150px;
            height: auto;
            max-height: 60px;
            object-fit: contain;
            display: block;
            border-radius: 18px;
        }

        .header-stats {
            display: flex;
            align-items: center;
            gap: 8px 14px;
            flex-wrap: wrap;
            flex: 1;
            justify-content: center;
        }
        .header-stats .stat-chip {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: rgba(255,255,255,0.05);
            padding: 3px 14px 3px 10px;
            border-radius: 18px;
            font-size: 12px;
            font-weight: 500;
            border: 1px solid rgba(255,255,255,0.06);
            color: #e6edf3;
        }
        .header-stats .stat-chip .stat-label {
            opacity: 0.7;
            font-weight: 400;
            font-size: 11px;
            color: #8b949e;
        }
        .header-stats .stat-chip .stat-value {
            font-weight: 700;
            font-size: 14px;
            color: #58a6ff;
        }
        .header-stats .stat-divider {
            color: #30363d;
            font-size: 14px;
            font-weight: 100;
        }

        .header-user {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255,255,255,0.05);
            padding: 4px 12px 4px 16px;
            border-radius: 30px;
            flex-shrink: 0;
            border: 1px solid #30363d;
        }
        .header-user .user-name {
            font-size: 13px;
            font-weight: 500;
            color: #e6edf3;
        }
        .header-user .user-role {
            font-size: 10px;
            opacity: 0.6;
            color: #8b949e;
        }
        .header-user .logout-header-btn {
            background: rgba(255,255,255,0.06);
            border: none;
            color: #8b949e;
            padding: 3px 12px;
            border-radius: 20px;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .header-user .logout-header-btn:hover {
            background: rgba(255,255,255,0.12);
            color: #e6edf3;
        }

        /* TABS */
        .tabs-container {
            background: #161b22;
            border-radius: 10px 10px 0 0;
            border: 1px solid #30363d;
            border-bottom: none;
            overflow: hidden;
            margin-top: 0;
        }
        .tabs {
            display: flex;
            border-bottom: 2px solid #30363d;
            background: #0d1117;
        }
        .tab-btn {
            padding: 12px 28px;
            border: none;
            background: transparent;
            font-size: 14px;
            font-weight: 600;
            color: #8b949e;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            border-bottom: 3px solid transparent;
        }
        .tab-btn:hover {
            color: #58a6ff;
            background: rgba(88, 166, 255, 0.06);
        }
        .tab-btn.active {
            color: #58a6ff;
            border-bottom-color: #58a6ff;
            background: #161b22;
        }
        .tab-btn i {
            margin-right: 8px;
        }
        .tab-content {
            display: none;
            padding: 20px;
            background: #161b22;
            border: 1px solid #30363d;
            border-top: none;
            border-radius: 0 0 10px 10px;
        }
        .tab-content.active {
            display: block;
        }

        /* FILTERS SECTION */
        .filters-section {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px 10px;
            padding: 10px 16px;
            background: #0d1117;
            border-radius: 10px;
            border: 1px solid #30363d;
            margin-bottom: 16px;
            position: relative;
        }
        .filter-group {
            display: flex;
            align-items: center;
            gap: 3px;
            flex-wrap: wrap;
        }
        .filter-group label {
            font-weight: 600;
            font-size: 10px;
            color: #8b949e;
            margin: 0;
            white-space: nowrap;
        }
        .filter-group select {
            padding: 3px 6px;
            border-radius: 4px;
            border: 1px solid #30363d;
            background: #0d1117;
            color: #e6edf3;
            font-size: 11px;
            min-width: 80px;
            max-width: 130px;
            height: 28px;
        }
        .filter-group select:focus {
            outline: none;
            border-color: #58a6ff;
            box-shadow: 0 0 0 2px rgba(88, 166, 255, 0.2);
        }
        .filter-group select option {
            background: #161b22;
            color: #e6edf3;
        }
        .filter-divider {
            color: #30363d;
            font-size: 14px;
            font-weight: 100;
            padding: 0 2px;
        }

        /* FAB Button */
        .fab-container {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-left: auto;
        }
        .fab-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: #238636;
            color: white;
            border: none;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(35, 134, 54, 0.4);
        }
        .fab-btn:hover {
            background: #2ea043;
            transform: scale(1.1) rotate(90deg);
            box-shadow: 0 6px 25px rgba(35, 134, 54, 0.6);
        }
        .fab-btn:active {
            transform: scale(0.95);
        }

        .stats-bar {
            background: #0d1117;
            border-radius: 10px;
            border: 1px solid #30363d;
            margin-bottom: 16px;
            overflow: hidden;
        }
        .stats-bar .stats-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            padding: 8px 18px;
            gap: 6px 16px;
        }
        .stats-bar .stats-row.stats-main {
            background: #0d1117;
            border-bottom: 1px solid #30363d;
        }
        .stats-bar .stat-item {
            font-size: 13px;
            color: #8b949e;
            white-space: nowrap;
        }
        .stats-bar .stat-item strong {
            color: #58a6ff;
            font-size: 15px;
        }
        .stats-bar .stat-divider {
            color: #30363d;
            font-size: 16px;
            font-weight: 100;
        }

        /* ADS GRID */
        .ads-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
            gap: 16px;
            padding: 0;
        }

        .ad-card {
            background: #161b22;
            border-radius: 10px;
            overflow: hidden;
            transition: all 0.3s ease;
            border: 1px solid #30363d;
            display: flex;
            flex-direction: column;
            border-left-width: 5px;
        }
        .ad-card:hover {
            box-shadow: 0 8px 30px rgba(0,0,0,0.6);
            transform: translateY(-3px);
            border-color: #58a6ff;
        }

        .card-header {
            padding: 10px 14px 8px;
            border-bottom: 1px solid #30363d;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 4px;
            background: #0d1117;
        }
        .card-header .file-name {
            font-size: 15px;
            font-weight: 600;
            color: #58a6ff;
        }
        .card-header .badge-group {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
        }
        .card-header .desk-badge {
            font-size: 9px;
            padding: 2px 8px;
            border-radius: 20px;
            font-weight: 600;
            background: #1a3a6b;
            color: white;
        }
        .card-header .icd-badge {
            font-size: 9px;
            padding: 2px 8px;
            border-radius: 20px;
            font-weight: 600;
            background: #c79306;
            color: white;
        }

        .card-body {
            padding: 8px 14px 10px;
            flex: 1;
        }
        .card-body .row {
            display: flex;
            flex-wrap: wrap;
            margin-bottom: 1px;
            line-height: 1.4;
        }
        .card-body .row .col {
            display: flex;
            align-items: baseline;
            flex: 1;
            min-width: 45%;
            padding: 1px 4px 1px 0;
        }
        .card-body .row .col-full {
            display: flex;
            align-items: baseline;
            flex: 0 0 100%;
            padding: 1px 0;
        }
        .card-body .label {
            font-size: 9.5pt;
            font-weight: 600;
            color: #8b949e;
            min-width: 60px;
            flex-shrink: 0;
            text-align: left;
        }
        .card-body .value {
            font-size: 9.2pt;
            color: #e6edf3;
            word-break: break-word;
            text-align: left;
        }
        .card-body .value.highlight {
            color: #58a6ff;
            font-weight: 600;
        }
        .card-body .value.boolean-yes {
            color: #3fb950;
        }
        .card-body .value.boolean-no {
            color: #f85149;
        }

        .card-actions {
            padding: 8px 14px 10px;
            border-top: 1px solid #30363d;
            display: flex;
            gap: 8px;
            justify-content: flex-end;
            flex-wrap: wrap;
            background: #0d1117;
        }
        .card-actions .btn-action {
            padding: 4px 16px;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .card-actions .btn-edit {
            background: #238636;
            color: white;
        }
        .card-actions .btn-edit:hover {
            background: #2ea043;
            transform: scale(1.02);
        }

        .no-results {
            text-align: center;
            padding: 40px 20px;
            color: #8b949e;
            background: #161b22;
            border-radius: 12px;
            grid-column: 1 / -1;
            border: 1px solid #30363d;
        }
        .no-results i { font-size: 36px; opacity: 0.3; display: block; margin-bottom: 12px; }

        .loading-spinner {
            text-align: center;
            padding: 50px 20px;
            color: #8b949e;
            grid-column: 1 / -1;
        }
        .loading-spinner i { font-size: 28px; margin-bottom: 10px; display: block; color: #58a6ff; }

        /* ============================================================
           MODAL - COMPLETE OVERRIDE FOR BOOTSTRAP
           ============================================================ */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 10000;
            display: none;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
        }
        .modal-overlay.show {
            display: flex;
        }
        .modal-overlay .modal-box {
            background: #161b22;
            border-radius: 12px;
            max-width: 1100px;
            width: 95%;
            max-height: 92vh;
            overflow-y: auto;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            animation: modalSlideIn 0.3s ease;
            border: 1px solid #30363d;
        }
        @keyframes modalSlideIn {
            from { transform: translateY(-30px) scale(0.95); opacity: 0; }
            to { transform: translateY(0) scale(1); opacity: 1; }
        }
        .modal-overlay .modal-header {
            padding: 16px 24px;
            background: linear-gradient(135deg, #0d1117 0%, #1a3a6b 100%);
            color: white;
            border-radius: 12px 12px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1;
            border-bottom: 1px solid #30363d;
        }
        .modal-overlay .modal-header h4 {
            margin: 0;
            font-weight: 600;
            font-size: 18px;
            color: #58a6ff;
        }
        .modal-overlay .modal-header h4 i {
            margin-right: 10px;
        }
        .modal-overlay .modal-header .close-btn {
            background: rgba(255,255,255,0.08);
            border: 1px solid #30363d;
            color: #8b949e;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay .modal-header .close-btn:hover {
            background: rgba(255,255,255,0.15);
            color: #e6edf3;
            transform: rotate(90deg);
            border-color: #58a6ff;
        }
        .modal-overlay .modal-body {
            padding: 24px 28px;
            color: #e6edf3;
            background: #0d1117;
        }
        .modal-overlay .modal-footer {
            padding: 12px 24px 20px;
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            border-top: 1px solid #30363d;
            background: #0d1117;
            border-radius: 0 0 12px 12px;
        }
        .modal-overlay .modal-footer .btn {
            padding: 8px 28px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            border: none;
        }
        .modal-overlay .modal-footer .btn-cancel {
            background: #21262d;
            color: #8b949e;
        }
        .modal-overlay .modal-footer .btn-cancel:hover {
            background: #30363d;
            color: #e6edf3;
        }
        .modal-overlay .modal-footer .btn-save {
            background: #238636;
            color: white;
        }
        .modal-overlay .modal-footer .btn-save:hover {
            background: #2ea043;
            transform: translateY(-1px);
            box-shadow: 0 4px 15px rgba(35, 134, 54, 0.3);
        }
        .modal-overlay .modal-footer .btn-save:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* ============================================================
           CRITICAL: OVERRIDE BOOTSTRAP FORM-CONTROL IN MODAL
           ============================================================ */
        .modal-overlay input,
        .modal-overlay select,
        .modal-overlay textarea,
        .modal-overlay .form-control,
        .modal-overlay input.form-control,
        .modal-overlay select.form-control,
        .modal-overlay textarea.form-control {
            background: #0d1117 !important;
            color: #e6edf3 !important;
            border: 1px solid #30363d !important;
            border-radius: 6px !important;
            padding: 8px 12px !important;
            font-size: 13px !important;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif !important;
            -webkit-box-shadow: none !important;
            box-shadow: none !important;
            transition: all 0.3s ease !important;
            width: 100% !important;
            height: auto !important;
        }

        .modal-overlay input:focus,
        .modal-overlay select:focus,
        .modal-overlay textarea:focus,
        .modal-overlay .form-control:focus,
        .modal-overlay input.form-control:focus,
        .modal-overlay select.form-control:focus,
        .modal-overlay textarea.form-control:focus {
            border-color: #58a6ff !important;
            box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.15) !important;
            background: #0d1117 !important;
            color: #e6edf3 !important;
            outline: none !important;
        }

        .modal-overlay input:hover,
        .modal-overlay select:hover,
        .modal-overlay textarea:hover,
        .modal-overlay .form-control:hover {
            border-color: #484f58 !important;
        }

        .modal-overlay input:disabled,
        .modal-overlay select:disabled,
        .modal-overlay textarea:disabled,
        .modal-overlay .form-control:disabled {
            background: #161b22 !important;
            color: #484f58 !important;
            cursor: not-allowed !important;
            opacity: 0.7 !important;
        }

        .modal-overlay input::placeholder,
        .modal-overlay select::placeholder,
        .modal-overlay textarea::placeholder,
        .modal-overlay .form-control::placeholder {
            color: #484f58 !important;
        }

        .modal-overlay input:-webkit-autofill,
        .modal-overlay input:-webkit-autofill:hover,
        .modal-overlay input:-webkit-autofill:focus,
        .modal-overlay input:-webkit-autofill:active,
        .modal-overlay .form-control:-webkit-autofill,
        .modal-overlay .form-control:-webkit-autofill:hover,
        .modal-overlay .form-control:-webkit-autofill:focus,
        .modal-overlay .form-control:-webkit-autofill:active {
            -webkit-box-shadow: 0 0 0 30px #0d1117 inset !important;
            -webkit-text-fill-color: #e6edf3 !important;
            caret-color: #e6edf3 !important;
            background-color: #0d1117 !important;
            background: #0d1117 !important;
        }

        /* ============================================================
           THREE COLUMN EDIT FORM - LAYOUT ONLY
           ============================================================ */
        .ad-edit-form {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 14px 20px;
        }
        .ad-edit-form .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .ad-edit-form .form-group.full-width {
            grid-column: 1 / -1;
        }
        .ad-edit-form .form-group label {
            font-size: 12px;
            font-weight: 500;
            color: #8b949e;
            letter-spacing: 0.3px;
            margin-bottom: 1px;
        }
        .ad-edit-form .form-group label .required-star {
            color: #f85149;
            margin-left: 2px;
        }

        .ad-edit-form .form-group .readonly-display {
            padding: 8px 12px;
            border-radius: 6px;
            background: #161b22;
            color: #8b949e;
            font-size: 13px;
            border: 1px solid #30363d;
            min-height: 38px;
            display: flex;
            align-items: center;
        }

        .ad-edit-form .form-group .date-format-hint {
            font-size: 10px;
            color: #484f58;
            margin-top: 3px;
            font-style: italic;
        }
        .ad-edit-form .form-group .date-format-hint i {
            margin-right: 4px;
            color: #8b949e;
        }
        .ad-edit-form .form-group .date-error {
            color: #f85149;
            font-size: 11px;
            margin-top: 3px;
            display: none;
        }
        .ad-edit-form .form-group .date-error.show {
            display: block;
        }
        .ad-edit-form .form-group input.date-error-input {
            border-color: #f85149 !important;
        }
        .ad-edit-form .form-group input.date-error-input:focus {
            border-color: #f85149 !important;

<script>
// ============================================================
// CONFIGURATION
// ============================================================
const API_BASE_URL = 'https://script.google.com/macros/s/AKfycbwMXaqmfN12vZ0ccqPvHYwRDhIgVEwIBQn6fJ74ACdnyy3--I4kCKoS66-pb_Je5X0vYA/exec';

// ============================================================
// GLOBAL STATE
// ============================================================
let allAds = [];
let filteredAds = [];
let loggedInUser = null;
let filterData = {};
let currentEditRowIndex = -1;
let isAddMode = false;
let dashboardDataLoaded = false;

// ============================================================
// DROPDOWN DATA
// ============================================================
const EXECUTIVE_OPTIONS = ['Yuvraj', 'Ketan', 'Kiran', 'Rushikesh', 'Uttam', 'Rohit', 'Sambhaji', 'Milind', 'Avinash', 'Nikhil'];
const ICD_USER_OPTIONS = ['VPY', 'VNH', 'PPC', 'VMD', 'LJT', 'MSV', 'SHP', 'SRO', 'SDN', 'PBJ', 'VBR', 'SAJ', 'UAB'];
const FORM_OPTIONS = Array.from({length: 15}, (_, i) => 'Form-' + String(i + 1).padStart(2, '0'));
const PAGE_OPTIONS = Array.from({length: 12}, (_, i) => 'Page-' + String(i + 1).padStart(2, '0'));
const BOOLEAN_OPTIONS = ['Yes', 'No'];

// ============================================================
// API CALL
// ============================================================
function callAPI(action, params) {
    return new Promise((resolve, reject) => {
        let url = API_BASE_URL + '?action=' + encodeURIComponent(action);
        if (params) {
            url += '&params=' + encodeURIComponent(JSON.stringify(params));
        }
        
        fetch(url, {
            method: 'GET',
            mode: 'cors',
            cache: 'no-cache',
            headers: { 'Accept': 'application/json' }
        })
        .then(response => {
            if (!response.ok) {
                throw new Error('HTTP error! status: ' + response.status);
            }
            return response.json();
        })
        .then(data => {
            resolve(data);
        })
        .catch(fetchError => {
            const callbackName = 'jsonp_cb_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
            
            const timeoutId = setTimeout(() => {
                if (window[callbackName]) {
                    delete window[callbackName];
                    reject(new Error('Request timeout'));
                }
            }, 10000);
            
            window[callbackName] = function(data) {
                clearTimeout(timeoutId);
                delete window[callbackName];
                resolve(data);
            };
            
            const script = document.createElement('script');
            script.src = url + '&callback=' + callbackName;
            script.onerror = function() {
                clearTimeout(timeoutId);
                delete window[callbackName];
                reject(new Error('JSONP script failed to load'));
            };
            document.body.appendChild(script);
            
            setTimeout(() => {
                if (script.parentNode) {
                    script.parentNode.removeChild(script);
                }
            }, 11000);
        });
    });
}

// ============================================================
// LOGIN SYSTEM
// ============================================================
async function handleLogin() {
    const username = document.getElementById('loginUsername').value.trim();
    const password = document.getElementById('loginPassword').value.trim();
    const errorEl = document.getElementById('loginError');
    const loginBtn = document.getElementById('loginBtn');
    
    errorEl.classList.remove('show');
    
    if (!username || !password) {
        errorEl.textContent = 'Please enter both username and password.';
        errorEl.classList.add('show');
        return;
    }
    
    loginBtn.disabled = true;
    loginBtn.innerHTML = '<i class="fa fa-spinner fa-spin"></i> Authenticating...';
    
    try {
        const result = await callAPI('authenticateUser', { 
            username: username, 
            password: password 
        });
        
        if (result.success && result.user) {
            loggedInUser = result.user;
            document.getElementById('loginOverlay').style.display = 'none';
            document.getElementById('mainContent').style.display = 'block';
            document.getElementById('headerUserName').textContent = result.user.name || result.user.username;
            document.getElementById('headerUserRole').textContent = result.user.role || 'User';
            
            showToast('Welcome, ' + (result.user.name || 'User') + '!', 'success');
            
            await loadDashboardData();
        } else {
            errorEl.textContent = result.message || 'Invalid username or password. Please try again.';
            errorEl.classList.add('show');
            loginBtn.disabled = false;
            loginBtn.innerHTML = '<i class="fa fa-sign-in"></i> Sign In';
        }
    } catch(err) {
        errorEl.textContent = 'Error connecting to server. Please try again.';
        errorEl.classList.add('show');
        loginBtn.disabled = false;
        loginBtn.innerHTML = '<i class="fa fa-sign-in"></i> Sign In';
        console.error('Login error:', err);
    }
}

function logout() {
    if (loggedInUser && loggedInUser.username) {
        callAPI('logoutUser', { username: loggedInUser.username }).catch(() => {});
    }
    loggedInUser = null;
    dashboardDataLoaded = false;
    document.getElementById('mainContent').style.display = 'none';
    document.getElementById('loginOverlay').style.display = 'flex';
    document.getElementById('loginUsername').value = '';
    document.getElementById('loginPassword').value = '';
    document.getElementById('loginError').classList.remove('show');
    document.getElementById('loginBtn').disabled = false;
    document.getElementById('loginBtn').innerHTML = '<i class="fa fa-sign-in"></i> Sign In';
    showToast('Logged out successfully', 'info');
}

document.addEventListener('DOMContentLoaded', function() {
    document.getElementById('loginPassword').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') handleLogin();
    });
    document.getElementById('loginUsername').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') document.getElementById('loginPassword').focus();
    });
    document.getElementById('loginUsername').focus();
});

// ============================================================
// TAB SWITCHING
// ============================================================
function switchTab(tabName) {
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
    
    if (tabName === 'ads') {
        document.querySelector('.tab-btn.active')?.classList.remove('active');
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('tab-ads').classList.add('active');
    }
}

// ============================================================
// LOAD DASHBOARD DATA
// ============================================================
async function loadDashboardData() {
    try {
        showToast('Loading data...', 'info');
        
        const result = await callAPI('getDashboardData', { 
            username: loggedInUser.username,
            role: loggedInUser.role,
            name: loggedInUser.name
        });
        
        if (result.success) {
            allAds = result.ads || [];
            filteredAds = [...allAds];
            
            if (result.userName) loggedInUser.name = result.userName;
            if (result.userRole) loggedInUser.role = result.userRole;
            document.getElementById('headerUserName').textContent = loggedInUser.name || loggedInUser.username;
            document.getElementById('headerUserRole').textContent = loggedInUser.role || 'User';
            
            filterData = result.filters || {};
            
            populateFilters();
            updateGlobalStats();
            applyFilters();
            
            dashboardDataLoaded = true;
            showToast('Dashboard loaded successfully!', 'success');
        } else {
            showError('Failed to load dashboard data: ' + (result.error || 'Unknown error'));
        }
    } catch(error) {
        console.error('Error loading dashboard:', error);
        showError('Error loading dashboard: ' + error.message);
    }
}

// ============================================================
// UPDATE GLOBAL STATS
// ============================================================
function updateGlobalStats() {
    const statsContainer = document.getElementById('headerStats');
    
    const totalAds = allAds.length;
    const desks = new Set(allAds.map(ad => ad.Desk).filter(d => d));
    const executives = new Set(allAds.map(ad => ad.Executive).filter(e => e));
    const agencies = new Set(allAds.map(ad => ad['Agency/Reporter']).filter(a => a));
    
    statsContainer.innerHTML = `
        <span class="stat-chip">
            <span class="stat-label">📋 Total</span>
            <span class="stat-value">${totalAds}</span>
        </span>
        <span class="stat-divider">|</span>
        <span class="stat-chip">
            <span class="stat-label">🏢 Desks</span>
            <span class="stat-value">${desks.size}</span>
        </span>
        <span class="stat-divider">|</span>
        <span class="stat-chip">
            <span class="stat-label">👤 Executives</span>
            <span class="stat-value">${executives.size}</span>
        </span>
        <span class="stat-divider">|</span>
        <span class="stat-chip">
            <span class="stat-label">📰 Agencies</span>
            <span class="stat-value">${agencies.size}</span>
        </span>
    `;
}

// ============================================================
// POPULATE FILTERS
// ============================================================
function populateFilters() {
    const filterMapping = {
        'filterDesk': 'Desk',
        'filterAgency': 'Agency/Reporter',
        'filterExecutive': 'Executive',
        'filterEdition': 'Edtion',
        'filterToDTP': 'To-DTP',
        'filterSchedule': 'Schedule',
        'filterForm': 'Form',
        'filterPage': 'Page',
        'filterFile': 'File',
        'filterAdvtRemark': 'Advt-Remark',
        'filterLocation': 'Location',
        'filterPhoto': 'Photo',
        'filterICDUser': 'ICD-User',
        'filterICDRemark': 'ICD-Remark'
    };
    
    Object.keys(filterMapping).forEach(filterId => {
        const key = filterMapping[filterId];
        const select = document.getElementById(filterId);
        if (!select) return;
        
        const values = filterData[key] || [];
        select.innerHTML = '<option value="__ALL__">All</option>';
        values.forEach(val => {
            const option = document.createElement('option');
            option.value = val;
            option.textContent = val;
            select.appendChild(option);
        });
    });
}

// ============================================================
// APPLY FILTERS
// ============================================================
function applyFilters() {
    const filterMapping = {
        'filterDesk': 'Desk',
        'filterAgency': 'Agency/Reporter',
        'filterExecutive': 'Executive',
        'filterEdition': 'Edtion',
        'filterToDTP': 'To-DTP',
        'filterSchedule': 'Schedule',
        'filterForm': 'Form',
        'filterPage': 'Page',
        'filterFile': 'File',
        'filterAdvtRemark': 'Advt-Remark',
        'filterLocation': 'Location',
        'filterPhoto': 'Photo',
        'filterICDUser': 'ICD-User',
        'filterICDRemark': 'ICD-Remark'
    };
    
    const activeFilters = {};
    Object.keys(filterMapping).forEach(filterId => {
        const key = filterMapping[filterId];
        const select = document.getElementById(filterId);
        if (select) {
            const val = select.value;
            if (val && val !== '__ALL__') {
                activeFilters[key] = val;
            }
        }
    });
    
    filteredAds = allAds.filter(ad => {
        for (const [key, val] of Object.entries(activeFilters)) {
            if (ad[key] !== val) return false;
        }
        return true;
    });
    
    renderAds(filteredAds);
    updateDisplayStats();
}

// ============================================================
// UPDATE DISPLAY STATS
// ============================================================
function updateDisplayStats() {
    const desks = new Set(filteredAds.map(ad => ad.Desk).filter(d => d));
    const executives = new Set(filteredAds.map(ad => ad.Executive).filter(e => e));
    const agencies = new Set(filteredAds.map(ad => ad['Agency/Reporter']).filter(a => a));
    
    document.getElementById('displayCount').textContent = filteredAds.length;
    document.getElementById('displayDesks').textContent = desks.size;
    document.getElementById('displayExecutives').textContent = executives.size;
    document.getElementById('displayAgencies').textContent = agencies.size;
}

// ============================================================
// RENDER ADS
// ============================================================
function renderAds(ads) {
    const grid = document.getElementById('adsGrid');
    if (ads.length === 0) {
        grid.innerHTML = `
            <div class="no-results">
                <i class="fa fa-search"></i>
                No advertisements found matching the current filters
                <br><small style="color:#484f58;">Try adjusting your filters</small>
            </div>
        `;
        return;
    }
    
    let html = '';
    ads.forEach((ad, index) => {
        html += buildAdCard(ad, index);
    });
    grid.innerHTML = html;
}

function buildAdCard(ad, index) {
    const rowIndex = allAds.indexOf(ad);
    const deskColor = ad.Desk ? getColorFromString(ad.Desk) : '#30363d';
    
    // Format date for display (DD/MM/YYYY)

// ============================================================
// HELPER: Get Color from String
// ============================================================
function getColorFromString(str) {
    const colors = ['#1a3a6b', '#6f42c1', '#c0392b', '#2a9922', '#c79306', '#2245f2', '#8e44ad', '#2980b9'];
    let hash = 0;
    for (let i = 0; i < str.length; i++) {
        hash = str.charCodeAt(i) + ((hash << 5) - hash);
    }
    return colors[Math.abs(hash) % colors.length];
}

// ============================================================
// DATE VALIDATION - DDMMYYYY
// ============================================================
function validateDateDDMMYYYY(dateStr) {
    if (!dateStr || dateStr.trim() === '') return { valid: true };
    
    const cleaned = dateStr.trim();
    if (!/^\d{8}$/.test(cleaned)) {
        return { valid: false, message: 'Date must be DDMMYYYY (8 digits)' };
    }
    
    const day = parseInt(cleaned.substring(0, 2));
    const month = parseInt(cleaned.substring(2, 4));
    const year = parseInt(cleaned.substring(4, 8));
    
    const date = new Date(year, month - 1, day);
    if (date.getFullYear() !== year || date.getMonth() !== month - 1 || date.getDate() !== day) {
        return { valid: false, message: 'Invalid date' };
    }
    
    if (year < 1900 || year > 2100) {
        return { valid: false, message: 'Year must be between 1900-2100' };
    }
    
    return { valid: true };
}

function formatDateForDisplay(dateStr) {
    if (!dateStr || dateStr.trim() === '') return '';
    const cleaned = dateStr.trim();
    if (cleaned.length === 8 && /^\d{8}$/.test(cleaned)) {
        return cleaned.substring(0, 2) + '/' + cleaned.substring(2, 4) + '/' + cleaned.substring(4, 8);
    }
    return cleaned;
}

            html += `<option value="${escapeHtml(opt)}" ${selected}>${escapeHtml(opt)}</option>`;
        });

    // Helper to create boolean dropdown

        const val = selectedValue || '';
        const yesSelected = val.toLowerCase() === 'yes' || val.toLowerCase() === 'true' || val === '1' ? 'selected' : '';
        const noSelected = val.toLowerCase() === 'no' || val.toLowerCase() === 'false' || val === '0' ? 'selected' : '';
        return `
            <option value="" ${!yesSelected && !noSelected ? 'selected' : ''}>— Select —</option>

            { key: 'Executive', label: 'Executive', type: 'select', options: EXECUTIVE_OPTIONS }
        ],
        [

            { key: 'Edtion', label: 'Edition', type: 'text' },
            { key: 'Size', label: 'Size', type: 'text' }
        ],
        [

            { key: 'Total', label: 'Total', type: 'text' },
            { key: 'GST', label: 'GST', type: 'text' }
        ],

            { key: 'Schedule', label: 'Schedule', type: 'select', options: BOOLEAN_OPTIONS },
            { key: 'Form', label: 'Form', type: 'select', options: FORM_OPTIONS }

            { key: 'Rate', label: 'Rate', type: 'text' }
        ],

            { key: 'Location', label: 'Location', type: 'text' },
            { key: 'Photo', label: 'Photo', type: 'select', options: BOOLEAN_OPTIONS }
        ],

        ]
    ];
    
    let html = '';
    
    fieldGroups.forEach(group => {
        const hasFullWidth = group.some(f => f.fullWidth);
        
        if (hasFullWidth) {
            group.forEach(field => {
                const value = ad[field.key] || '';

                    <div class="form-group full-width">

// ============================================================
// DATE VALIDATION FUNCTION
// ============================================================
function validateDateInput(input) {
    const fieldId = input.id;
    const errorId = 'dateError_' + fieldId.replace('edit_', '');
    const errorEl = document.getElementById(errorId);
    
    if (!errorEl) return;
    
    const value = input.value.trim();
    
    if (value === '') {
        errorEl.classList.remove('show');
        input.classList.remove('date-error-input');
        return;
    }
    
    const cleaned = value.replace(/\//g, '');
    if (cleaned.length <= 8 && /^\d*$/.test(cleaned)) {
        let formatted = '';
        for (let i = 0; i < cleaned.length; i++) {
            if (i === 2 || i === 4) {
                formatted += '/';
            }
            formatted += cleaned[i];
        }
        if (formatted !== value) {
            input.value = formatted;
        }
    }
    
    const rawValue = input.value.replace(/\//g, '');
    if (rawValue.length === 8) {
        const validation = validateDateDDMMYYYY(rawValue);
        if (validation.valid) {
            errorEl.classList.remove('show');
            input.classList.remove('date-error-input');
        } else {
            errorEl.textContent = validation.message || 'Invalid date format';
            errorEl.classList.add('show');
            input.classList.add('date-error-input');
        }
    } else if (rawValue.length > 0 && rawValue.length < 8) {
        errorEl.textContent = 'Enter all 8 digits (DDMMYYYY)';
        errorEl.classList.add('show');
        input.classList.add('date-error-input');
    } else {
        errorEl.classList.remove('show');
        input.classList.remove('date-error-input');
    }
}

// ============================================================
// SAVE AD DATA
// ============================================================
async function saveAdData() {
    const saveBtn = document.getElementById('saveAdBtn');
    saveBtn.disabled = true;
    saveBtn.innerHTML = '<i class="fa fa-spinner fa-spin"></i> Saving...';
    
    try {
        const fieldConfig = [
            'Desk', 'Agency/Reporter', 'Executive', 'Client', 'Edtion', 'Size', 
            'SQCM', 'Total', 'GST', 'To-DTP', 'Schedule', 'Form', 'Page', 'File', 
            'Rate', 'Advt-Remark', 'Location', 'Photo', 'ICD-User', 'ICD-Remark'
        ];
        
        const adData = {};
        let hasDateError = false;
        
        fieldConfig.forEach(key => {
            const element = document.getElementById(`edit_${key}`);
            if (element) {
                let value = element.value.trim();
                
                if (key === 'To-DTP' && value) {
                    const rawValue = value.replace(/\//g, '');
                    if (rawValue.length === 8 && /^\d{8}$/.test(rawValue)) {
                        const validation = validateDateDDMMYYYY(rawValue);
                        if (!validation.valid) {
                            hasDateError = true;
                            const errorId = 'dateError_' + key;
                            const errorEl = document.getElementById(errorId);
                            if (errorEl) {
                                errorEl.textContent = validation.message || 'Invalid date format';
                                errorEl.classList.add('show');
                            }
                            const inputEl = document.getElementById(`edit_${key}`);
                            if (inputEl) inputEl.classList.add('date-error-input');
                        }
                        value = rawValue;
                    } else if (value.length > 0) {
                        hasDateError = true;
                        const errorId = 'dateError_' + key;
                        const errorEl = document.getElementById(errorId);
                        if (errorEl) {
                            errorEl.textContent = 'Date must be DDMMYYYY (8 digits)';
                            errorEl.classList.add('show');
                        }
                        const inputEl = document.getElementById(`edit_${key}`);
                        if (inputEl) inputEl.classList.add('date-error-input');
                    }
                }
                
                adData[key] = value;
            }
        });
        
        if (hasDateError) {
            showToast('❌ Please fix the date format errors before saving.', 'error');
            saveBtn.disabled = false;
            saveBtn.innerHTML = isAddMode ? '<i class="fa fa-plus"></i> Add New' : '<i class="fa fa-save"></i> Save Changes';
            return;
        }
        
        let result;
        
        if (isAddMode) {
            result = await callAPI('addAd', {
                username: loggedInUser.username,
                adData: adData
            });
        } else {
            result = await callAPI('updateAd', {
                username: loggedInUser.username,
                rowIndex: currentEditRowIndex,
                adData: adData
            });
        }
        
        if (result.success) {
            showToast(isAddMode ? '✅ Ad added successfully!' : '✅ Ad updated successfully!', 'success');
            
            if (isAddMode) {
                await loadDashboardData();
            } else {
                if (allAds[currentEditRowIndex]) {
                    Object.keys(adData).forEach(key => {
                        allAds[currentEditRowIndex][key] = adData[key];
                    });
                }
                applyFilters();
            }
            closeEditModal();
        } else {
            showToast('❌ Error saving data: ' + (result.error || 'Unknown error'), 'error');
        }
    } catch(error) {
        showToast('❌ Error saving data: ' + error.message, 'error');
    } finally {
        saveBtn.disabled = false;
        saveBtn.innerHTML = isAddMode ? '<i class="fa fa-plus"></i> Add New' : '<i class="fa fa-save"></i> Save Changes';
    }
}

    document.getElementById('editAdModal').classList.remove('show');
    currentEditRowIndex = -1;
    isAddMode = false;
